services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hadith
      POSTGRES_PASSWORD: hadith
      POSTGRES_DB: hadith_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hadith"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://hadith:hadith@db:5432/hadith_db
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-5-mini}
      SUNNAH_API_KEY: ${SUNNAH_API_KEY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      DEBUG: "false"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      HADITH_DATA_DIR: /research/hadiths
      TELEGRAM_ARCHIVE_DIR: /research/archive
    volumes:
      - ./data/hadiths:/research/hadiths:ro
      - ../telegram-archive/kkee9938:/research/archive:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  pg_data:
